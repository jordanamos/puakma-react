# vortex server definitions for CI. ci-cd/ is the vortex workspace in the pipeline
# (VORTEX_HOME), so this file sits where vortex expects it: <workspace>/config/servers.ini.
# No credentials here: the pipeline supplies vortexUsername / vortexPassword.
# One section per server you deploy to; serverName in the pipeline variables picks one.
[DEFAULT]
port = 80
soap_path = system/SOAPDesigner.pma
webdesign_path = system/webdesign.pma
backend = gateway
gateway_path = vortex/gateway.pma
; resources with these extensions are always cloned (deploy.mjs also passes --get-resources)
clone_with_resources = css,js

[dev]
host = jsoma.net
